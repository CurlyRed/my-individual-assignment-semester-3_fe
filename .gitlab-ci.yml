variables:
  IMAGE_NAME: "localhost:6000/ias3_fe"
  IMAGE_TAG: "latest"
  VITE_API_URL: "http://localhost:8000"

stages:
  - build
  - test
  - deploy

build:
  stage: build
  script: 
    - npm install
    - npm run build

test:
  stage: test
  image: cypress/base:14
  services:
    - name: cypress/base:14
  variables:
    VITE_API_URL: $VITE_API_URL
    CI: "true"
  script:
    - npm install
    - npm start &
    - npx wait-on http://localhost:8080  
    - npm run cypress:run
  artifacts:
    when: always
    paths:
      - cypress/screenshots
      - cypress/videos

deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "localhost:6000"
  script:
    - |
      if [[ "$CI_COMMIT_REF_NAME" != "$CI_DEFAULT_BRANCH" ]]; then
        echo "Skipping Docker image build as the pipeline was not triggered from the main branch."
      elif [[ "$CI_JOB_STATUS" != "success" ]]; then
        echo "Skipping Docker image build as the build stage failed."
      else
        echo "Building Docker image..."
        docker build -t $IMAGE_NAME:$IMAGE_TAG .
        echo "Pushing Docker image..."
        docker push $IMAGE_NAME:$IMAGE_TAG
      fi
  only:
    - master
    - main