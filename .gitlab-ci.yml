stages:
  - build
  - push

variables:
  DOCKER_DRIVER: overlay2
  CI_REGISTRY: registry.git.fhict.nl
  CI_REGISTRY_IMAGE: registry.git.fhict.nl/i506400/my-individual-assignment-semester-3_fe
  IMAGE_TAG: $CI_COMMIT_SHA

before_script:
  - echo "$CI_REGISTRY_USER"
  - echo "$CI_REGISTRY_PASSWORD"
  - echo "$CI_REGISTRY"
  - echo "$CI_REGISTRY_IMAGE"
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

build:
  stage: build
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - dist/

push:
  stage: push
  script:
    - |
      if [[ "$CI_COMMIT_REF_NAME" == "$CI_DEFAULT_BRANCH" ]]; then
        lower_registry=$(echo $CI_REGISTRY_IMAGE | tr '[:upper:]' '[:lower:]')
        echo "Building Docker image..."
        docker build -t $lower_registry/frontend:$IMAGE_TAG .
        echo "Pushing Docker image to $lower_registry/frontend:$IMAGE_TAG..."
        docker push $lower_registry/frontend:$IMAGE_TAG
      else
        echo "Skipping Docker image build as the pipeline was not triggered from the main branch."
      fi
  only:
    - master
    - main
    - dev


