stages:
  - build
  - push

variables:
  DOCKER_DRIVER: overlay2
  REGISTRY: git.fhict.nl/I506400/my-individual-assignment-semester-3_fe
  IMAGE_TAG: $CI_COMMIT_SHA

build:
  stage: build
  script: 
    - npm install
    - npm run build

push:
  stage: push
  script:
    - |
      if [[ "$CI_COMMIT_REF_NAME" != "$CI_DEFAULT_BRANCH" ]]; then
        echo "Skipping Docker image build as the pipeline was not triggered from the main branch."
      elif [[ "$CI_JOB_STATUS" != "success" ]]; then
        echo "Skipping Docker image build as the build stage failed."
      else
        docker build -t $REGISTRY/frontend:$IMAGE_TAG .
        docker push $REGISTRY/frontend:$IMAGE_TAG
      fi
  only:
    - master
    - main
    - dev