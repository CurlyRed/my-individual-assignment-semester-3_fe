variables:
  IMAGE_NAME: "localhost:6000/ias3_fe"
  IMAGE_TAG: "latest"
  VITE_API_URL: "http://localhost:8000"

stages:
  - build
  - deploy

build:
  stage: build
  script: 
    - npm install
    - npm run build

deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "localhost:6000"
  script:
    - echo "Building Docker image..."
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - echo "Pushing Docker image..."
    - docker push $IMAGE_NAME:$IMAGE_TAG
  only:
    - master
    - main
